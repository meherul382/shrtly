<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Links | Shrtigo</title><meta name="robots" content="noindex,nofollow"><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#172033;background:linear-gradient(180deg,#f7f9ff,#fff);min-height:100vh}.wrap{width:min(1080px,calc(100% - 32px));margin:auto;padding:70px 0}.top{text-align:center;margin-bottom:28px}.top h1{margin:0;font-size:38px;letter-spacing:-1px}.top p{margin:9px auto 0;max-width:700px;color:#687386;line-height:1.6}.panel{background:#fff;border:1px solid #e2e8f1;border-radius:20px;box-shadow:0 14px 40px rgba(23,32,51,.07);padding:22px}.selectbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.check{font-size:13px;font-weight:800;color:#536174}.check input{margin-right:7px}.danger{border:0;background:#fff0f0;color:#b91c1c;padding:9px 12px;border-radius:9px;font-weight:800;cursor:pointer}.history{display:grid;gap:10px}.history-item{display:flex;align-items:center;gap:13px;padding:15px;border:1px solid #e2e8f1;border-radius:14px;background:#fbfcff}.history-main{min-width:0;flex:1}.history-main a{color:#2563eb;font-weight:900;word-break:break-all}.note{color:#687386;font-size:12px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-actions{display:flex;gap:7px}.ghost{border:1px solid #d7deea;background:#fff;color:#536174;padding:8px 11px;border-radius:9px;font-weight:800;cursor:pointer}.empty{text-align:center;color:#687386;padding:40px 10px;margin:0}.back{text-align:center;margin-top:18px}.back a{color:#2563eb;font-weight:800;font-size:13px}@media(max-width:600px){.wrap{padding:35px 0}.top h1{font-size:30px}.history-item{align-items:flex-start}.history-actions{flex-direction:column}.selectbar{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header class="top"><h1>My Links</h1><p>Recently created short links are stored locally in your browser for convenience. This history is specific to the device and browser you use.</p></header><section class="panel"><div id="selectBar" class="selectbar" style="display:none"><label class="check"><input id="selectAll" type="checkbox"> Select all</label><button type="button" id="deleteSelected" class="danger">Delete selected</button></div><div id="historyList" class="history"></div><p id="empty" class="empty">No links yet on this device.</p></section><div class="back"><a href="/">← Back to Shrtigo</a></div></main><script>
const $=id=>document.getElementById(id);
function load(){try{return JSON.parse(localStorage.getItem('shrtigo-history')||'[]')}catch{return[]}}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderHistory(){const a=load();const historyList=$('historyList'),empty=$('empty'),selectBar=$('selectBar'),selectAll=$('selectAll');historyList.innerHTML=a.map((x,i)=>'<div class="history-item"><input class="rowcheck" type="checkbox" data-index="'+i+'"><div class="history-main"><a href="'+escapeHtml(x.short||'')+'" target="_blank" rel="noopener">'+escapeHtml(x.short||'')+'</a><div class="note">'+escapeHtml(x.long||'')+'</div><div class="note">'+(x.simple?'⚡ Simple ':'')+(x.image?'🖼️ ':'')+(x.youtube?'▶️ YouTube':'')+'</div></div><div class="history-actions"><button type="button" class="ghost" data-copy="'+escapeHtml(x.short||'')+'">Copy</button><button type="button" class="danger" data-delete="'+i+'">Delete</button></div></div>').join('');empty.style.display=a.length?'none':'block';selectBar.style.display=a.length?'flex':'none';selectAll.checked=false;document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copy));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const a=load();a.splice(Number(b.dataset.delete),1);localStorage.setItem('shrtigo-history',JSON.stringify(a));renderHistory()})}
$('selectAll').onchange=()=>document.querySelectorAll('.rowcheck').forEach(c=>c.checked=$('selectAll').checked);
$('deleteSelected').onclick=()=>{const a=load(),del=[...document.querySelectorAll('.rowcheck:checked')].map(c=>Number(c.dataset.index));if(!del.length)return;localStorage.setItem('shrtigo-history',JSON.stringify(a.filter((_,i)=>!del.includes(i))));renderHistory()};
renderHistory();
</script></body></html>
