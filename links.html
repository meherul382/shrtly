</style></head><body><div class="layout"><aside class="side"><a class="brand" href="/"><span>S</span><b>Shrtigo</b></a><nav class="nav"><a href="/dashboard.html">▦ <span>Overview</span></a><a href="/#create-link">＋ <span>Create Link</span></a><a href="/analytics-login.html?next=%2Fanalytics-shortener.html">⌁ <span>Analytics</span></a><a class="active" href="/links.html">↗ <span>Links</span></a><a href="/subscription.html">▣ <span>Plans</span></a><a href="/dashboard.html#domains">◎ <span>Domains</span></a><a href="/invoices.html">▤ <span>Invoices</span></a><a href="/subscription.html#requestSection">＋ <span>Add Fund</span></a><a href="/dashboard.html#notifications">♧ <span>Notifications</span></a><a href="/dashboard.html#tickets">▱ <span>Tickets</span></a><a href="/dashboard.html#profile">♙ <span>Profile</span></a><a href="/central-login.html">↪ <span>Logout</span></a></nav></aside><main class="main"><div class="head"><div><h1>Links Management</h1><p>All links created from your Shrtigo account in one place.</p></div><a class="btn" href="/#create-link">＋ Create Link</a></div><div class="panel"><div class="toolbar"><input id="search" class="search" placeholder="Search short link or destination..."><span id="count" class="status"></span></div><div id="list"></div><div id="empty" class="empty" style="display:none">No links found.</div></div></main></div><script>
const SUPABASE_URL='https://qbijrkdlaguwlvriaiky.supabase.co',SUPABASE_KEY='sb_publishable_CS7wauVRlHpbsdjJFdWl1g_cNdjogHJ';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let all=[];
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='/central-login.html?next=%2Flinks.html';return}const r=await fetch('/api/dashboard',{headers:{Authorization:'Bearer '+session.access_token}});const d=await r.json();if(!r.ok){document.getElementById('empty').style.display='block';document.getElementById('empty').textContent=d.error||'Could not load links.';return}all=d.links||[];render()}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const rows=all.filter(x=>(x.domain+'/'+x.code).toLowerCase().includes(q)||x.url.toLowerCase().includes(q));document.getElementById('count').textContent=rows.length+' link'+(rows.length===1?'':'s');const list=document.getElementById('list');list.innerHTML='';document.getElementById('empty').style.display=rows.length?'none':'block';rows.forEach(x=>{const row=document.createElement('div');row.className='link';row.innerHTML='<div class="code"></div><div class="dest"></div><div class="clicks"></div><div class="actions"></div>';row.querySelector('.code').textContent=x.domain+'/'+x.code;row.querySelector('.dest').textContent=x.url;row.querySelector('.clicks').textContent=Number(x.clicks||0)+' clicks';const a=row.querySelector('.actions');if(x.analytics){const b=document.createElement('button');b.textContent='📊 Analytics';b.onclick=()=>location.href='/analytics.html?code='+encodeURIComponent(x.code);a.appendChild(b)}const del=document.createElement('button');del.className='del';del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete this link?'))return;const rr=await fetch('/api/dashboard-delete',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({code:x.code})});if(rr.ok)load();else alert((await rr.json()).error||'Could not delete link.')};a.appendChild(del);list.appendChild(row)})}
document.getElementById('search').oninput=render;load();
</script></body></html>
