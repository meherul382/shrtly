<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redirecting | Shrtigo</title>
</head>
<body>
  <p>Redirecting to Shrtigo central login…</p>
  <script>
    const next = new URLSearchParams(location.search).get('next') || '/analytics-shortener.html';
    const safeNext = next.startsWith('/') && !next.startsWith('//') ? next : '/analytics-shortener.html';
    location.replace('/login?next=' + encodeURIComponent(safeNext));
  </script>
</body>
</html>
