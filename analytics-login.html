'msg').textContent=t||'';$('msg').style.color=e?'#b42318':'#718096'}function mode(){$('title').textContent=signup?'Create your account':'Log in to your account';$('sub').textContent=signup?'Create an account to save your Shrtigo links and analytics.':'Enter your credentials to access your dashboard.';$('submit').textContent=signup?'Create Account':'Log In';$('switchText').textContent=signup?'Already have an account?':"Don't have an account?";$('switch').textContent=signup?'Log in instead':'Create one for free';$('forgot').style.display=signup?'none':'inline-block';msg('')}$('switch').onclick=()=>{signup=!signup;mode()};$('google').onclick=async()=>{const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/analytics-login.html?next='+encodeURIComponent(next)}});if(error)msg(error.message,true)};$('submit').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('Please enter your email and password.',true);$('submit').disabled=true;msg(signup?'Creating account…':'Signing in…');try{const r=signup?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/analytics-login.html?next='+encodeURIComponent(next)}}):await sb.auth.signInWithPassword({email,password});if(r.error){msg(r.error.message,true);return}if(signup&&!r.data.session){location.href='/email-confirmation.html?email='+encodeURIComponent(email)+'&next='+encodeURIComponent(next)}else if(r.data.session){location.replace(next)}}catch(e){msg(e.message||'Something went wrong. Please try again.',true)}finally{$('submit').disabled=false}};$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email)return msg('Enter your email address first.',true);try{const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/analytics-login.html?next='+encodeURIComponent(next)});msg(error?error.message:'Password reset email sent.',!!error)}catch(e){msg(e.message||'Something went wrong. Please try again.',true)}};sb.auth.getSession().then(({data})=>{if(data.session)location.replace(next)});mode();</script></body></html>
