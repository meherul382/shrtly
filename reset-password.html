<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | Shrtigo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:#f7f9ff;color:#172033}.card{width:min(420px,calc(100% - 32px));background:#fff;padding:32px;border:1px solid #e2e8f1;border-radius:20px;box-shadow:0 18px 50px #17203312}.brand{text-align:center;font-size:25px;font-weight:900;margin-bottom:28px}.mark{display:inline-grid;place-items:center;width:38px;height:38px;margin-right:8px;border-radius:11px;background:#2563eb;color:#fff}.title{text-align:center;margin:0 0 8px;font-size:28px}.sub{text-align:center;color:#718096;font-size:14px;margin:0 0 24px}.field{display:block;margin:14px 0 6px;font-size:13px;font-weight:800}.input{width:100%;height:48px;border:1px solid #d8dee8;border-radius:10px;padding:0 13px;font-size:15px}.btn{width:100%;height:48px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:20px}.msg{text-align:center;min-height:20px;font-size:13px;margin-top:12px}
</style></head><body><main class="card"><div class="brand"><span class="mark">S</span>Shrtigo</div><h1 class="title">Set new password</h1><p class="sub">Create a new password for your account.</p><label class="field" for="password">New password</label><input id="password" class="input" type="password" autocomplete="new-password" placeholder="Enter new password"><label class="field" for="confirm">Confirm password</label><input id="confirm" class="input" type="password" autocomplete="new-password" placeholder="Confirm new password"><button id="submit" class="btn">Update Password</button><div id="msg" class="msg"></div></main>
<script>
const sb=supabase.createClient('https://qbijrkdlaguwlvriaiky.supabase.co','sb_publishable_CS7wauVRlHpbsdjJFdWl1g_cNdjogHJ');
const $=id=>document.getElementById(id);function message(t,error=false){$('msg').textContent=t;$('msg').style.color=error?'#b42318':'#718096'}
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')message('You can now set a new password.');});
$('submit').onclick=async()=>{const password=$('password').value,confirm=$('confirm').value;if(password.length<6)return message('Password must be at least 6 characters.',true);if(password!==confirm)return message('Passwords do not match.',true);$('submit').disabled=true;message('Updating password…');const{error}=await sb.auth.updateUser({password});if(error){message(error.message,true);$('submit').disabled=false;return}message('Password updated successfully. Redirecting…');setTimeout(()=>location.replace('/central-login.html'),900)};
</script></body></html>
