  <circle cx="92" cy="0" r="34" fill="#111827"/><text x="80" y="12" font-family="Arial" font-size="34" fill="#fff">X</text>
  <circle cx="184" cy="0" r="34" fill="#22c55e"/><path d="M169 -7c0-10 8-18 18-18 10 0 18 8 18 18v10c0 10-8 18-18 18h-5l-9 7 3-12c-4-3-7-8-7-13z" fill="#fff"/>
  <circle cx="276" cy="0" r="34" fill="#ef4444"/><path d="M264 -8h24v17h-24z" fill="#fff"/><path d="M273 -5l9 5-9 5z" fill="#ef4444"/>
  <circle cx="368" cy="0" r="34" fill="#2494e8"/><path d="M350 1l29-12-12 27-7-9z" fill="#fff"/>
</g>
<text x="132" y="437" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#172033">Short links. Share anywhere.</text>
