<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
<title id="title">Shrtigo URL shortening illustration</title>
<desc id="desc">A clean illustration showing a long website address becoming a short Shrtigo link, with sharing icons.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef5ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#172033" flood-opacity=".12"/></filter>
</defs>
<rect width="720" height="500" rx="36" fill="url(#bg)"/>
<circle cx="570" cy="100" r="92" fill="#dceaff" opacity=".8"/>
<circle cx="112" cy="420" r="72" fill="#edf4ff"/>
<g filter="url(#shadow)">
  <rect x="92" y="92" width="510" height="180" rx="26" fill="#fff" stroke="#dce5f2"/>
  <circle cx="122" cy="122" r="7" fill="#ff6b6b"/><circle cx="146" cy="122" r="7" fill="#f5c451"/><circle cx="170" cy="122" r="7" fill="#35c979"/>
  <rect x="126" y="154" width="420" height="52" rx="14" fill="#f7f9fc" stroke="#dce5f2"/>
  <text x="148" y="187" font-family="Arial, sans-serif" font-size="20" fill="#66758a">https://yourwebsite.com/very-long-url</text>
  <path d="M214 232 C260 284 350 298 402 260" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <path d="M392 247 l18 12 -20 8" fill="#2563eb"/>
  <rect x="292" y="244" width="292" height="82" rx="22" fill="#fff" stroke="#dce5f2"/>
  <rect x="316" y="264" width="216" height="42" rx="12" fill="#eef5ff"/>
  <text x="334" y="292" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#2563eb">shrtigo.xyz/Ab3k7</text>
  <rect x="542" y="264" width="26" height="42" rx="9" fill="#2563eb"/>
  <path d="M550 275h10v12h-10z M553 271h10v12" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
</g>
<g transform="translate(132 348)">
