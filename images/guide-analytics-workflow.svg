<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">How analytics short links work</title><desc id="desc">A three-step visual flow from creating a short link to sharing it and viewing analytics.</desc><rect width="1200" height="675" rx="36" fill="#f7f9fc"/><text x="600" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="900" fill="#172033">Create → Share → Measure</text><g font-family="Arial,sans-serif"><rect x="75" y="180" width="310" height="300" rx="26" fill="#fff" stroke="#dbe3f0" stroke-width="3"/><circle cx="230" cy="245" r="42" fill="#2563eb"/><text x="230" y="258" text-anchor="middle" font-size="34" font-weight="900" fill="#fff">1</text><text x="230" y="330" text-anchor="middle" font-size="25" font-weight="800" fill="#172033">Create</text><text x="230" y="370" text-anchor="middle" font-size="17" fill="#687386">Paste a destination URL</text><text x="230" y="398" text-anchor="middle" font-size="17" fill="#687386">and create an Analytics</text><text x="230" y="426" text-anchor="middle" font-size="17" fill="#687386">Short Link.</text><path d="M405 330 H495" stroke="#9bb5dc" stroke-width="8" stroke-linecap="round"/><path d="M480 312 L505 330 L480 348" fill="none" stroke="#9bb5dc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="445" y="285" width="105" height="34" rx="17" fill="#eef4ff"/><text x="497" y="308" text-anchor="middle" font-size="13" font-weight="800" fill="#2563eb">short URL</text><rect x="445" y="390" width="105" height="34" rx="17" fill="#eef4ff"/><text x="497" y="413" text-anchor="middle" font-size="13" font-weight="800" fill="#2563eb">tracking</text><rect x="585" y="180" width="310" height="300" rx="26" fill="#fff" stroke="#dbe3f0" stroke-width="3"/><circle cx="740" cy="245" r="42" fill="#2563eb"/><text x="740" y="258" text-anchor="middle" font-size="34" font-weight="900" fill="#fff">2</text><text x="740" y="330" text-anchor="middle" font-size="25" font-weight="800" fill="#172033">Share</text><text x="740" y="370" text-anchor="middle" font-size="17" fill="#687386">Use the short link in</text><text x="740" y="398" text-anchor="middle" font-size="17" fill="#687386">social posts, messages,</text><text x="740" y="426" text-anchor="middle" font-size="17" fill="#687386">or campaigns.</text><path d="M915 330 H1005" stroke="#9bb5dc" stroke-width="8" stroke-linecap="round"/><path d="M990 312 L1015 330 L990 348" fill="none" stroke="#9bb5dc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="1035" y="180" width="90" height="300" rx="26" fill="#fff" stroke="#dbe3f0" stroke-width="3"/><circle cx="1080" cy="245" r="42" fill="#2563eb"/><text x="1080" y="258" text-anchor="middle" font-size="34" font-weight="900" fill="#fff">3</text><text x="1080" y="330" text-anchor="middle" font-size="20" font-weight="800" fill="#172033" transform="rotate(90 1080 330)">Measure</text><path d="M1055 420 L1072 402 L1087 412 L1108 380" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></svg>