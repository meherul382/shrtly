<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support Inbox | Shrtigo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f8ff;color:#172033}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:24px 0}.brand{font-size:24px;font-weight:900}.btn{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}.danger{background:#fee2e2;color:#b91c1c}.muted{color:#687386;font-size:14px}.card{background:#fff;border:1px solid #e1e8f2;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 14px 40px #1720330b}.hidden{display:none!important}.msg{font-size:13px;white-space:pre-wrap}.thread{border:1px solid #e3e9f3;border-radius:14px;margin-top:14px;overflow:hidden}.thread-head{padding:12px 14px;background:#f7f9ff;font-size:12px;font-weight:800;word-break:break-all}.thread-body{padding:14px;display:grid;gap:8px;max-height:320px;overflow:auto}.bubble{max-width:85%;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.bubble.user{justify-self:end;background:#2563eb;color:#fff}.bubble.admin{justify-self:start;background:#f1f5f9;color:#172033}.reply{display:flex;gap:8px;padding:12px;border-top:1px solid #e5eaf2}.reply textarea{flex:1;min-width:0;resize:vertical;min-height:42px;padding:10px;border:1px solid #d7dfec;border-radius:10px;font:inherit;font-size:13px}.empty{color:#687386;text-align:center;padding:25px}@media(max-width:600px){.reply{flex-direction:column}.reply .btn{width:100%}}
</style>
</head>
<body><div class="wrap"><header class="top"><div class="brand">💬 Shrtigo Support</div><button id="logout" class="btn danger hidden">Log out</button></header><section id="login" class="card"><h2>Admin access</h2><p class="muted">Checking the authorized admin session…</p><p id="loginMsg" class="msg"></p></section><main id="panel" class="hidden"><section class="card"><h2>Support Inbox</h2><p class="muted">Read user messages and reply privately.</p><button id="refresh" class="btn">Refresh</button><p id="status" class="msg"></p></section><section id="threads"></section></main></div>
<script>
const SUPABASE_URL='https://qbijrkdlaguwlvriaiky.supabase.co';const SUPABASE_KEY='sb_publishable_CS7wauVRlHpbsdjJFdWl1g_cNdjogHJ';const ADMIN='meherulhassan62@gmail.com';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let session=null;let cache=[];
function esc(value){return String(value??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
function note(text,error=false){$('status').textContent=text;$('status').style.color=error?'#b91c1c':'#687386';}
function loginNote(text,error=false){$('loginMsg').textContent=text;$('loginMsg').style.color=error?'#b91c1c':'#687386';}
function render(){const groups={};cache.forEach(m=>{const id=String(m.user_id||'unknown');(groups[id]||(groups[id]=[])).push(m);});const ids=Object.keys(groups);if(!ids.length){$('threads').innerHTML='<section class="card empty">No support messages yet.</section>';return;}$('threads').innerHTML=ids.map(id=>{const messages=groups[id].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));return '<section class="card thread"><div class="thread-head">User ID: '+esc(id)+'</div><div class="thread-body">'+messages.map(m=>'<div class="bubble '+(m.sender_role==='admin'?'admin':'user')+'">'+esc(m.message)+'<div style="opacity:.65;font-size:10px;margin-top:5px">'+esc(new Date(m.created_at).toLocaleString())+'</div></div>').join('')+'</div><div class="reply"><textarea id="reply-'+esc(id)+'" maxlength="2000" placeholder="Write a reply…"></textarea><button class="btn" data-reply="'+esc(id)+'">Reply</button></div></section>';}).join('');$('threads').querySelectorAll('[data-reply]').forEach(button=>button.addEventListener('click',()=>reply(button.dataset.reply)));}
async function load(){if(!session)return;note('Loading…');try{const r=await fetch('/api/support-messages',{headers:{Authorization:'Bearer '+session.access_token}});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not load messages.');cache=Array.isArray(data.messages)?data.messages:[];render();note('Loaded '+cache.length+' message(s).');}catch(e){note(e.message||'Could not load messages.',true);}}
async function reply(userId){const field=$('reply-'+userId);const message=field.value.trim();if(!message)return;note('Sending…');try{const r=await fetch('/api/support-messages',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({user_id:userId,message})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Reply failed.');field.value='';await load();}catch(e){note(e.message||'Reply failed.',true);}}
async function boot(){try{const r=await sb.auth.getSession();session=r.data.session;if(!session||String(session.user.email||'').toLowerCase()!==ADMIN){if(session)await sb.auth.signOut();loginNote('Only the authorized admin account can access this page.',true);return;}$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('logout').classList.remove('hidden');await load();}catch(e){loginNote(e.message||'Could not check admin session.',true);}}
$('refresh').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload();};sb.auth.onAuthStateChange((_event,s)=>{session=s;});boot();
</script></body></html>
