<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscription Requests | Shrtigo Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f8ff;color:#172033}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:25px 0}.brand{font-size:24px;font-weight:900}.btn{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}.danger{background:#fee2e2;color:#b91c1c}.card{background:#fff;border:1px solid #e2e8f1;border-radius:18px;padding:22px;box-shadow:0 15px 40px #1720330d;margin-bottom:18px}.muted{color:#687386;font-size:14px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:13px;border-bottom:1px solid #edf1f6;font-size:13px}th{color:#687386;font-size:12px;text-transform:uppercase}.pill{display:inline-block;padding:5px 9px;border-radius:99px;font-weight:800;font-size:11px}.pending{background:#fff4d6;color:#986b00}.active{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#b91c1c}.actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}.login{max-width:420px;margin:80px auto}.msg{margin-top:12px;font-size:13px;white-space:pre-wrap}@media(max-width:700px){.top{align-items:flex-start;gap:12px;flex-direction:column}}</style></head>
<body><div class="wrap"><header class="top"><div class="brand">🛠️ Shrtigo Admin</div><button id="logout" class="btn danger hidden">Log out</button></header>
<section id="login" class="card login"><h2>Admin Login</h2><p class="muted">Only the authorized admin account can access this panel.</p><button id="google" class="btn">Continue with Google</button><p id="loginMsg" class="msg"></p></section>
<main id="panel" class="hidden"><section class="card"><h2>💳 Subscription Requests</h2><p class="muted">Approve or reject manual payment requests. Discounted coupon amounts are shown as the payable amount.</p><button id="refresh" class="btn">Refresh Requests</button><p id="msg" class="msg"></p></section><section class="card table"><table><thead><tr><th>Created</th><th>User ID</th><th>Plan</th><th>Amount</th><th>Payment</th><th>Transaction ID</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></section></main></div>
<script>
const sb=supabase.createClient('https://qbijrkdlaguwlvriaiky.supabase.co','sb_publishable_CS7wauVRlHpbsdjFjdWl1g_cNdjogHJ'),ADMIN='meherulhassan62@gmail.com',$=id=>document.getElementById(id);let session=null;
function msg(t,error=false){$('msg').textContent=t;$('msg').style.color=error?'#b91c1c':'#687386'}function loginMsg(t,error=false){$('loginMsg').textContent=t;$('loginMsg').style.color=error?'#b91c1c':'#687386'}
async function boot(){try{const r=await sb.auth.getSession();session=r.data.session;if(session&&String(session.user.email).toLowerCase()===ADMIN)show();else if(session){await sb.auth.signOut();loginMsg('This Google account is not authorized.',true)}}catch(e){loginMsg('Login check failed: '+e.message,true)}}
function show(){$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('logout').classList.remove('hidden');load()}
async function load(){if(!session)return;msg('Loading…');$('rows').innerHTML='';try{const r=await fetch('/api/admin-subscriptions',{headers:{Authorization:'Bearer '+session.access_token}});const raw=await r.text();let data={};try{data=JSON.parse(raw)}catch{throw new Error('Invalid server response.')}if(!r.ok)throw new Error(data.error||'Could not load requests.');const requests=Array.isArray(data.requests)?data.requests:[];$('rows').innerHTML=requests.map(x=>{const status=String(x.status||'pending');const amount=(x.final_amount!==null&&x.final_amount!==undefined&&x.final_amount!=='')?Number(x.final_amount):0;return '<tr><td>'+new Date(x.created_at).toLocaleString()+'</td><td><code>'+String(x.user_id||'')+'</code></td><td>'+String(x.plan||'')+'</td><td>৳'+amount.toFixed(2)+'</td><td>'+String(x.payment_method||'')+'</td><td><code>'+String(x.transaction_id||'')+'</code></td><td><span class="pill '+status+'">'+status+'</span></td><td><div class="actions">'+(status==='pending'?'<button class="btn" onclick="act(\''+x.id+'\',\'approve\')">Approve</button><button class="btn danger" onclick="act(\''+x.id+'\',\'reject\')">Reject</button>':'—')+'</div></td></tr>'}).join('')||'<tr><td colspan="8">No requests found.</td></tr>';msg('Loaded '+requests.length+' request(s).')}catch(e){msg(e.message||'Could not load requests.',true)}}
async function act(id,action){if(!confirm(action==='approve'?'Approve this subscription?':'Reject this subscription?'))return;msg('Updating…');try{const r=await fetch('/api/admin-subscriptions',{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({id,action})});const raw=await r.text();let data={};try{data=JSON.parse(raw)}catch{}if(!r.ok)throw new Error(data.error||'Update failed.');await load()}catch(e){msg(e.message||'Update failed.',true)}}
$('google').onclick=async()=>{const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(r.error)loginMsg(r.error.message,true)};$('refresh').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};sb.auth.onAuthStateChange((_e,s)=>{session=s;if(s&&String(s.user.email).toLowerCase()===ADMIN)show()});boot();
</script></body></html>
