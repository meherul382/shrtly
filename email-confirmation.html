<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check Your Email | Shrtigo</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#172033;background:linear-gradient(180deg,#f7f9ff,#fff)}.card{width:min(520px,100%);background:#fff;border:1px solid #e2e8f1;border-radius:24px;padding:42px 34px;text-align:center;box-shadow:0 18px 55px rgba(23,32,51,.08)}.icon{width:72px;height:72px;margin:0 auto 20px;border-radius:20px;background:#eef4ff;display:grid;place-items:center;font-size:34px}.eyebrow{color:#2563eb;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.card h1{font-size:34px;letter-spacing:-1.5px;margin:10px 0 12px}.card p{color:#687386;line-height:1.6;margin:8px 0}.email{font-weight:800;color:#172033;word-break:break-word}.actions{display:flex;gap:10px;margin-top:25px}.btn{flex:1;text-decoration:none;padding:13px 16px;border-radius:12px;font-weight:800}.primary{background:#2563eb;color:#fff}.secondary{background:#eef4ff;color:#2563eb}@media(max-width:520px){.card{padding:34px 22px}.actions{flex-direction:column}}
</style></head><body><main class="card"><div class="icon">✉️</div><div class="eyebrow">Shrtigo Account</div><h1>Check your email</h1><p>We’ve created your account. Please check your inbox and click the confirmation link to verify your email address.</p><p id="emailText" class="email"></p><p>After confirming your email, come back and log in to your Shrtigo account.</p><div class="actions"><a class="btn primary" href="/dashboard.html?login=1">Go to Login</a><a class="btn secondary" href="/">Back to Shrtigo</a></div></main><script>const email=new URLSearchParams(location.search).get('email');if(email)document.getElementById('emailText').textContent=email;</script></body></html>
