name: Inject homepage profile
on:
  push:
    branches: [subscription-system-2026-09-20]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add profile script to homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="/profile.js"></script>'
          if marker not in s:
              s = s.replace('</body>', marker + '</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit injected script
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Inject homepage profile controls'
          git push
