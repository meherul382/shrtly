name: Fix Analytics auth gate boot state
on:
  push:
    paths:
      - '.github/workflows/fix-analytics-auth-boot.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix auth boot class
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('analytics-shortener.html')
          s=p.read_text()
          old='<body>\n<header>'
          new='<body class="auth-boot">\n<header>'
          if old not in s:
              raise SystemExit('analytics body target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics-shortener.html
          git commit -m 'Fix Analytics authentication gate'
          git push
          git rm .github/workflows/fix-analytics-auth-boot.yml
          git commit -m 'Remove temporary analytics auth workflow'
          git push
