name: Apply homepage polish

on:
  push:
    branches:
      - subscription-system-2026-09-20

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[skip home polish]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject homepage polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="/home-polish.js" defer></script>'
          if tag not in text:
              marker = '</head>'
              if marker not in text:
                  raise SystemExit('Could not find </head> in index.html')
              text = text.replace(marker, tag + marker, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Polish homepage navigation [skip home polish]'
          git push
