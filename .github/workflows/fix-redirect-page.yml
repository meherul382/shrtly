name: Fix redirect page
on:
  push:
    paths:
      - '.github/workflows/fix-redirect-page.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove visible continue interstitial
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/r/[code].js')
          s=p.read_text()
          s=s.replace("const redirectScript = `<script>setTimeout(function(){ window.location.replace(${JSON.stringify(link.url)}); },2000);</script>`;", "const redirectScript = `<script>window.location.replace(${JSON.stringify(link.url)});</script>`;")
          old='<main class="wrap">${image}${video}<section class="continue"><div class="copy"><div class="label">You are continuing to</div><div class="host">${safeDestinationHost}</div></div><a class="btn" href="${safeUrl}">Continue</a></section></main>${analyticsPing}${redirectScript}'
          new='<main class="wrap">${image}${video}</main>${analyticsPing}${redirectScript}'
          if old not in s:
              raise SystemExit('Expected redirect body not found')
          s=s.replace(old,new)
          s=s.replace('body{display:flex;align-items:center;justify-content:center;padding:12px;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#111}', 'body{display:block;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#111}')
          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/fix-redirect-page.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/r/[code].js .github/workflows/fix-redirect-page.yml
          git commit -m 'Remove visible redirect interstitial'
          git push
