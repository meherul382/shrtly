name: Add Dashboard link to analytics shortener

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-dashboard-link.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Dashboard navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('analytics-shortener.html')
          s = p.read_text()
          old_css = '.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{'
          new_css = '.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.nav-actions{display:flex;align-items:center;gap:22px}.dashboard{font-size:14px;font-weight:800;color:#2563eb}.brand{'
          if old_css in s and '.nav-actions' not in s:
              s = s.replace(old_css, new_css, 1)
          old = '<header><div class="wrap nav"><a class="brand" href="/"><span>＋</span>Shrtigo</a><a class="back" href="/">← Back to Shrtigo</a></div></header>'
          new = '<header><div class="wrap nav"><a class="brand" href="/"><span>＋</span>Shrtigo</a><div class="nav-actions"><a class="dashboard" href="/dashboard.html">📊 Dashboard</a><a class="back" href="/">← Back to Shrtigo</a></div></div></header>'
          if old not in s:
              raise SystemExit('Expected analytics header not found; no change made.')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics-shortener.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add Dashboard link to analytics shortener'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/add-dashboard-link.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary dashboard link workflow' || true
          git push || true
