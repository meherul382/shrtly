name: Fix Analytics login screen visibility
on:
  push:
    paths:
      - '.github/workflows/fix-analytics-login-screen.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep page hidden until Analytics login
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('analytics-shortener.html')
          s=p.read_text()
          old="function authShowLogin(){document.body.classList.remove('auth-boot');$('authbox').classList.add('show');"
          new="function authShowLogin(){$('authbox').classList.add('show');"
          if old not in s:
              raise SystemExit('authShowLogin target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics-shortener.html
          git commit -m 'Keep Analytics page hidden before login'
          git push
          git rm .github/workflows/fix-analytics-login-screen.yml
          git commit -m 'Remove temporary Analytics login workflow'
          git push
