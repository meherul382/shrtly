name: Fix Analytics reload login
on:
  push:
    paths:
      - '.github/workflows/fix-analytics-reload-login.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep Supabase session across reloads
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('analytics-shortener.html')
          s = p.read_text()
          old = """async function initAnalyticsAuth(){
            const {data:{session}}=await authSb.auth.getSession();
            if(!session){authShowLogin();return}
            if(!(await syncAnalyticsSession(session))){authShowLogin();return}
            window.analyticsSession=session;authShowApp();
          }"""
          new = """async function initAnalyticsAuth(){
            const {data:{session}}=await authSb.auth.getSession();
            if(!session){authShowLogin();return}
            window.analyticsSession=session;
            authShowApp();
            syncAnalyticsSession(session).catch(()=>{});
          }"""
          if old not in s:
              raise SystemExit('analytics-shortener auth block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('analytics-login.html')
          s = p.read_text()
          old = """async function go(session){if(!session)return;msg('Signing you in…');if(await sync(session))location.replace(next);else msg('Could not start your secure session. Please try again.',true)}"""
          new = """async function go(session){if(!session)return;msg('Signing you in…');sync(session).catch(()=>{});location.replace(next)}"""
          if old not in s:
              raise SystemExit('analytics-login auth block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('api/auth/session.js')
          s = p.read_text()
          old = """    if(!r.ok)return res.status(401).json({error:'Invalid login session.'});"""
          new = """    if(!r.ok)return res.status(401).json({error:'Invalid login session.'});"""
          if old not in s:
              raise SystemExit('session endpoint sanity check failed')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics-shortener.html analytics-login.html api/auth/session.js
          git commit -m 'Fix analytics session persistence on reload'
          git push
          git rm .github/workflows/fix-analytics-reload-login.yml
          git commit -m 'Remove temporary analytics reload fix workflow'
          git push
