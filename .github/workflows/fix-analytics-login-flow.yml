name: Fix analytics login flow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update login routing
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('href="/analytics-shortener.html">📊 Analytics Short Link', 'href="/analytics-login.html?next=%2Fanalytics-shortener.html">📊 Analytics Short Link')
          p.write_text(s)

          p = Path('analytics-login.html')
          s = p.read_text()
          s = s.replace("sb.auth.getSession().then(({data})=>{if(data.session)location.replace(next)});mode();", "mode();")
          p.write_text(s)

          p = Path('analytics-shortener.html')
          s = p.read_text()
          old = "async function initAnalyticsAuth(){\n  const {data:{session}}=await authSb.auth.getSession();\n  if(!session){authShowLogin();return}\n  window.analyticsSession=session;\n  authShowApp();\n  syncAnalyticsSession(session).catch(()=>{});\n}"
          new = "async function initAnalyticsAuth(){\n  const {data:{session}}=await authSb.auth.getSession();\n  if(!session){location.replace('/analytics-login.html?next=%2Fanalytics-shortener.html');return}\n  window.analyticsSession=session;\n  authShowApp();\n  syncAnalyticsSession(session).catch(()=>{});\n}"
          if old not in s:
              raise SystemExit('analytics-shortener auth block not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html analytics-login.html analytics-shortener.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix analytics login page flow"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/fix-analytics-login-flow.yml
          git commit -m "Remove one-time login flow workflow"
          git push