name: Add Analytics navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Analytics Short Link navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="/simple-shortener.html">⚡ Simple Short Link</a><a href="#history">My Links</a>'
          new = '<a href="/simple-shortener.html">⚡ Simple Short Link</a><a href="/analytics-shortener.html">📊 Analytics Short Link</a><a href="#history">My Links</a>'
          if old in s and new not in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Analytics Short Link to homepage"
          git push
