<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coupon Manager | Shrtigo Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f8ff;color:#172033}.wrap{width:min(1100px,calc(100% - 32px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:25px 0}.brand{font-size:24px;font-weight:900}.btn{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}.danger{background:#fee2e2;color:#b91c1c}.card{background:#fff;border:1px solid #e2e8f1;border-radius:18px;padding:22px;box-shadow:0 15px 40px #1720330d;margin-bottom:18px}.muted{color:#687386;font-size:14px}.field{width:100%;padding:12px;border:1px solid #d7deea;border-radius:10px;margin:7px 0 10px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:13px;border-bottom:1px solid #edf1f6;font-size:13px}th{color:#687386;font-size:12px;text-transform:uppercase}.msg{font-size:13px;white-space:pre-wrap}.hidden{display:none!important}.empty{text-align:center;color:#687386;padding:22px}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><header class="top"><div class="brand">🎟️ Coupon Manager</div><button id="logout" class="btn danger hidden">Log out</button></header>
<section id="login" class="card"><h2>Admin access</h2><p class="muted">Only the authorized admin account can manage coupons.</p><button id="google" class="btn">Continue with Google</button><p id="loginMsg" class="msg"></p></section>
<main id="panel" class="hidden"><section class="card"><h2>➕ Create Coupon</h2><p class="muted">Create percentage or fixed BDT discounts for subscription plans.</p><div class="grid"><input id="code" class="field" placeholder="Code e.g. SAVE20"><select id="type" class="field"><option value="percent">Percent %</option><option value="fixed">Fixed BDT</option></select><input id="value" class="field" type="number" min="0" step="0.01" placeholder="Discount value"><input id="max" class="field" type="number" min="1" placeholder="Max uses (optional)"><input id="expiry" class="field" type="datetime-local"></div><button id="create" class="btn">Create Coupon</button><p id="msg" class="msg"></p></section>
<section class="card"><h2>🎟️ Coupon List</h2><p class="muted">Enable or disable coupons whenever you need.</p><button id="refresh" class="btn">Refresh</button><div class="table" style="margin-top:12px"><table><thead><tr><th>Code</th><th>Discount</th><th>Uses</th><th>Expires</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div>
<script>
const sb=supabase.createClient('https://qbijrkdlaguwlvriaiky.supabase.co','sb_publishable_CS7wauVRlHpbsdjJFdWl1g_cNdjogHJ'),ADMIN='meherulhassan62@gmail.com',$=id=>document.getElementById(id);let session=null;
function loginMsg(t,e=false){$('loginMsg').textContent=t;$('loginMsg').style.color=e?'#b91c1c':'#687386'}
async function rpc(name,body){const r=await fetch('https://qbijrkdlaguwlvriaiky.supabase.co/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:'sb_publishable_CS7wauVRlHpbsdjJFdWl1g_cNdjogHJ',Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(body||{})});const raw=await r.text();let d=null;try{d=JSON.parse(raw)}catch{}if(!r.ok)throw new Error(d?.message||d?.hint||'Request failed.');return d}
async function load(){try{const d=await rpc('shrtigo_admin_list_coupons',{});const rows=Array.isArray(d)?d:[];$('rows').innerHTML=rows.map(c=>'<tr><td><b>'+String(c.code)+'</b></td><td>'+String(c.discount_value)+(c.discount_type==='percent'?'%':' BDT')+'</td><td>'+String(c.used_count)+(c.max_uses?' / '+c.max_uses:'')+'</td><td>'+String(c.expires_at?new Date(c.expires_at).toLocaleString():'Never')+'</td><td>'+String(c.active?'Active':'Off')+'</td><td><button class="btn '+(c.active?'danger':'')+'" onclick="toggleCoupon(\''+c.id+'\','+(!c.active)+')">'+(c.active?'Disable':'Enable')+'</button></td></tr>').join('')||'<tr><td colspan="6" class="empty">No coupons yet.</td></tr>'}catch(e){$('msg').textContent=e.message}}
async function toggleCoupon(id,active){try{await rpc('shrtigo_admin_toggle_coupon',{p_id:id,p_active:active});await load()}catch(e){$('msg').textContent=e.message}}
$('create').onclick=async()=>{const code=$('code').value.trim(),value=Number($('value').value),type=$('type').value,max=$('max').value?Number($('max').value):null,exp=$('expiry').value?new Date($('expiry').value).toISOString():null;if(!code||!(value>0))return $('msg').textContent='Enter coupon code and a discount value.';try{await rpc('shrtigo_admin_create_coupon',{p_code:code,p_discount_type:type,p_discount_value:value,p_max_uses:max,p_expires_at:exp});$('code').value='';$('value').value='';$('max').value='';$('expiry').value='';$('msg').textContent='Coupon created successfully.';await load()}catch(e){$('msg').textContent=e.message}}
async function boot(){try{const r=await sb.auth.getSession();session=r.data.session;if(!session||String(session.user.email||'').toLowerCase()!==ADMIN){if(session)await sb.auth.signOut();loginMsg('Only the authorized admin account can access this page.',true);return}$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('logout').classList.remove('hidden');await load()}catch(e){loginMsg(e.message||'Could not check admin session.',true)}}
$('google').onclick=async()=>{const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(r.error)loginMsg(r.error.message,true)};$('refresh').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};boot();
</script></body></html>
