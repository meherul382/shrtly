<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Link Analytics | Shrtigo</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#172033;background:#f6f8ff}.wrap{width:min(1050px,calc(100% - 32px));margin:auto}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:900}.brand span{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#2563eb;color:#fff;margin-right:8px;font-size:16px}.navright{display:flex;gap:16px;align-items:center}.back{color:#5f6b7a;font-weight:800;font-size:14px}.dash{color:#2563eb;font-weight:900;font-size:14px}.hero{padding:36px 0 20px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:900;color:#2563eb}.hero h1{margin:8px 0;font-size:40px;letter-spacing:-1.5px}.destination{color:#687386;word-break:break-all}.live{display:inline-flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;font-weight:800}.dot{width:9px;height:9px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 5px #dcfce7}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e4e9f1;border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(23,32,51,.05)}.label{color:#687386;font-size:13px;font-weight:800}.num{font-size:36px;font-weight:900;margin-top:6px}.small{color:#687386;font-size:13px;margin-top:4px}.panel{margin-top:18px;background:#fff;border:1px solid #e4e9f1;border-radius:18px;padding:22px}.panel h2{margin:0 0 14px;font-size:20px}.activity{display:grid;gap:10px}.activity-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:12px 0;border-bottom:1px solid #edf0f5}.activity-row:last-child{border-bottom:0}.time{color:#687386;font-size:13px}.empty{color:#687386}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;background:#ecfdf3;color:#15803d;font-size:12px;font-weight:900;white-space:nowrap}.muted{color:#687386;font-size:13px;word-break:break-all}.error{padding:30px;text-align:center;color:#b91c1c;background:#fff;border:1px solid #fecaca;border-radius:18px;margin-top:35px}@media(max-width:700px){.cards{grid-template-columns:1fr}.hero h1{font-size:32px}.navright{gap:10px}.back,.dash{font-size:12px}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="/"><span>S</span>Shrtigo</a><div class="navright"><a class="dash" href="/dashboard.html">📊 Dashboard</a><a class="back" href="/analytics-shortener.html">← Create another</a></div></div></header>
<main class="wrap" id="app"><section class="hero"><div class="eyebrow">📊 Link Analytics</div><h1 id="title">Traffic overview</h1><div id="destination" class="destination">Loading…</div><div class="live"><span class="dot"></span><span id="liveText">Updating live</span></div></section><section class="cards"><article class="card"><div id="clickLabel" class="label">TOTAL CLICKS</div><div id="clicks" class="num">—</div><div id="clickSmall" class="small">All recorded visits</div></article><article class="card"><div id="visitorLabel" class="label">UNIQUE VISITORS</div><div id="visitors" class="num">—</div><div id="visitorSmall" class="small">Distinct anonymous visitors</div></article><article class="card"><div class="label">ACTIVE NOW</div><div id="active" class="num">—</div><div class="small">Across all analytics links · last 5 minutes</div></article></section><section class="panel"><h2 id="panelTitle">Recent activity</h2><div id="activity" class="activity"><div class="empty">Loading activity…</div></div></section></main>
<script>
const qs=new URLSearchParams(location.search),code=qs.get('code'),token=qs.get('token');const $=id=>document.getElementById(id);let timer;function fail(msg){$('app').innerHTML='<div class="error">'+msg+'</div>';if(timer)clearInterval(timer)}function ago(ts){const s=Math.max(0,Math.floor((Date.now()-new Date(ts).getTime())/1000));if(s<10)return'just now';if(s<60)return s+'s ago';const m=Math.floor(s/60);if(m<60)return m+'m ago';const h=Math.floor(m/60);return h+'h ago'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loadSingle(){const r=await fetch('/api/analytics?code='+encodeURIComponent(code)+'&token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Analytics unavailable.');$('destination').textContent=d.url;$('clicks').textContent=Number(d.clicks||0).toLocaleString();$('visitors').textContent=Number(d.uniqueVisitors||0).toLocaleString();$('active').textContent=Number(d.activeVisitors||0).toLocaleString();$('liveText').textContent='Live · updated just now';const list=d.recent||[];$('activity').innerHTML=list.length?list.map(x=>'<div class="activity-row"><strong>Visitor activity</strong><span class="time">'+ago(x.last_seen)+'</span></div>').join(''):'<div class="empty">No visitor activity yet.</div>'}async function loadAll(){const r=await fetch('/api/analytics?all=1&token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Analytics unavailable.');$('title').textContent='All traffic overview';$('destination').textContent=Number(d.totalLinks||0).toLocaleString()+' analytics links are being tracked';$('clicks').textContent=Number(d.totalClicks||0).toLocaleString();$('visitors').textContent=Number(d.uniqueVisitors||0).toLocaleString();$('active').textContent=Number(d.activeVisitors||0).toLocaleString();$('clickSmall').textContent='Combined across all analytics links';$('visitorSmall').textContent='Combined anonymous visitors';$('liveText').textContent='Live · updated just now';$('panelTitle').textContent='Your analytics links';const list=d.links||[];$('activity').innerHTML=list.length?list.map(x=>'<div class="activity-row"><div><strong>/'+esc(x.code)+'</strong><div class="muted">'+esc(x.url)+'</div></div><span class="pill">● '+Number(x.activeVisitors||0).toLocaleString()+' online</span></div>').join(''):'<div class="empty">No analytics links yet.</div>'}async function load(){if(!token)return fail('This private analytics dashboard link is incomplete. Please open Analytics from your saved link.');try{if(code)await loadSingle();else await loadAll()}catch(e){fail(e.message)}}load();timer=setInterval(load,10000);
</script></body></html>
