<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in | Shrtigo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:#f7f9ff;color:#172033}.card{width:min(420px,calc(100% - 32px));background:#fff;padding:32px;border:1px solid #e2e8f1;border-radius:20px;box-shadow:0 18px 50px #17203312}.brand{text-align:center;font-size:25px;font-weight:900;margin-bottom:28px}.mark{display:inline-grid;place-items:center;width:38px;height:38px;margin-right:8px;border-radius:11px;background:#2563eb;color:#fff}.title{text-align:center;margin:0 0 8px;font-size:28px}.sub{text-align:center;color:#718096;font-size:14px;margin:0 0 24px}.field{display:block;margin:14px 0 6px;font-size:13px;font-weight:800}.input{width:100%;height:48px;border:1px solid #d8dee8;border-radius:10px;padding:0 13px;font-size:15px}.btn{width:100%;height:48px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:16px}.google{background:#fff;color:#172033;border:1px solid #d8dee8;margin-top:0}.forgot{display:block;text-align:right;margin-top:10px;color:#2563eb;font-size:13px;font-weight:800;text-decoration:none}.switch{text-align:center;margin-top:22px;font-size:14px;color:#718096}.switch button{border:0;background:none;color:#2563eb;font-weight:800;cursor:pointer}.msg{text-align:center;min-height:20px;font-size:13px;margin-top:12px}
</style></head><body><main class="card"><div class="brand"><span class="mark">S</span>Shrtigo</div><h1 id="title" class="title">Log in to Shrtigo</h1><p id="sub" class="sub">Sign in to access your homepage and links.</p><button id="google" class="btn google">Continue with Google</button><label class="field" for="email">Email address</label><input id="email" class="input" type="email" autocomplete="email" placeholder="you@example.com"><label class="field" for="password">Password</label><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Your password"><a id="forgot" class="forgot" href="#">Forgot password?</a><button id="submit" class="btn">Log In</button><div id="msg" class="msg"></div><div class="switch"><span id="switchText">Don't have an account?</span> <button id="switch">Create one for free</button></div></main>
<script>
const sb=supabase.createClient('https://qbijrkdlaguwlvriaiky.supabase.co','sb_publishable_CS7wauVRlHpbsdjJFdWl1g_cNdjogHJ');
const $=id=>document.getElementById(id);let signup=false;const requestedNext=new URLSearchParams(location.search).get('next');const next=requestedNext&&requestedNext.startsWith('/')&&!requestedNext.startsWith('//')?requestedNext:'/home';
function message(t,error=false){$('msg').textContent=t;$('msg').style.color=error?'#b42318':'#718096'}
function mode(){ $('title').textContent=signup?'Create your Shrtigo account':'Log in to Shrtigo';$('sub').textContent=signup?'Create an account to save your links.':'Sign in to access your homepage and links.';$('submit').textContent=signup?'Create Account':'Log In';$('switchText').textContent=signup?'Already have an account?':"Don't have an account?";$('switch').textContent=signup?'Log in instead':'Create one for free';$('forgot').style.display=signup?'none':'block';message('') }
$('switch').onclick=()=>{signup=!signup;mode()};
$('google').onclick=async()=>{const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/central-login.html?next='+encodeURIComponent(next)}});if(error)message(error.message,true)};
$('forgot').onclick=async(e)=>{e.preventDefault();const email=$('email').value.trim();if(!email)return message('Enter your email address first.',true);$('forgot').textContent='Sending…';const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password.html'});$('forgot').textContent='Forgot password?';if(error)return message(error.message,true);message('Password reset link sent. Check your email.');};
$('submit').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return message('Enter your email and password.',true);$('submit').disabled=true;message(signup?'Creating account…':'Signing in…');try{const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error)return message(r.error.message,true);if(signup&&!r.data.session)return message('Check your email to confirm your account.');if(r.data.session)location.replace(next)}catch(e){message(e.message||'Something went wrong.',true)}finally{$('submit').disabled=false}};
sb.auth.getSession().then(({data})=>{if(data.session)location.replace(next)});mode();
</script></body></html>
